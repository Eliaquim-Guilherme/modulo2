<!DOCTYPE html> <!-- Informa ao navegador que este documento usa HTML5 -->
<html lang="pt-br"> <!--Marca o inicio da página HTML. O atributo lang="pt-BR" indica o idioma principal é o portugues. -->
<head> <!-- Cabeçalho da pagina. Aqui fica configurações e informações que não vão aparecer no corpo da pagina -->
    <meta charset="UTF-8"> <!-- Define o padrão de caracteres. Permite acentos, ç, alguns emojis e caracteres especiais.-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!--Faz a pagina se adaptar a celulares e computadores-->
    <title>Meu primeiro site</title> <!--O título da página-->
</head> <!-- Fecha a tag HEAD -->
<body> <!-- Corpo da pagina. Tudo que aparece para o usuario fica aqui! -->
    <h1>Bem vindo ao meu site!</h1>
    <h2>Site para estudo do curso</h2>
    <p>Essa é uma estrutura HTML básica.</p>
    <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
    </ul>
</body> <!--Fecha a tag BODY-->
</html>
